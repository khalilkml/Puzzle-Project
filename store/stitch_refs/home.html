<script>
  (function() {
    // Sound effect synthesis for cozy wooden "thud/clack"
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playWoodClack(pitch = 300) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.09);
      } catch (e) {
        // Fallback gracefully if audio permissions are denied
      }
    }

    // Play Button Interactive Clack & Haptic
    const playBtn = document.getElementById('playButton');
    if (playBtn) {
      playBtn.addEventListener('click', () => {
        playWoodClack(440);
        if (navigator.vibrate) navigator.vibrate([15, 30, 20]);
      });
    }

    // Interactive Cube Hero Bounce
    const cubeHero = document.getElementById('cubeHero');
    if (cubeHero) {
      cubeHero.addEventListener('click', () => {
        playWoodClack(520);
        cubeHero.classList.add('scale-110', 'rotate-3');
        setTimeout(() => {
          cubeHero.classList.remove('scale-110', 'rotate-3');
        }, 220);
      });
    }

    // Audio / Vibe Toggle Micro-interactions
    let soundOn = true;
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    if (soundToggle && soundIcon) {
      soundToggle.addEventListener('click', () => {
        soundOn = !soundOn;
        soundIcon.textContent = soundOn ? 'volume_up' : 'volume_off';
        if (soundOn) playWoodClack(350);
      });
    }

    let vibeOn = true;
    const vibeToggle = document.getElementById('vibeToggle');
    const vibeIcon = document.getElementById('vibeIcon');
    if (vibeToggle && vibeIcon) {
      vibeToggle.addEventListener('click', () => {
        vibeOn = !vibeOn;
        vibeIcon.textContent = vibeOn ? 'vibration' : 'smartphone';
        if (vibeOn && navigator.vibrate) navigator.vibrate(25);
        playWoodClack(280);
      });
    }

    const rankToggle = document.getElementById('rankToggle');
    if (rankToggle) {
      rankToggle.addEventListener('click', () => playWoodClack(380));
    }

    const settingsBtn = document.getElementById('settingsBtn');
    if (settingsBtn) {
      settingsBtn.addEventListener('click', () => playWoodClack(320));
    }
  })();
</script></main></body></html>

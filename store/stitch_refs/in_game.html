<script>
  (function() {
    const pieces = document.querySelectorAll('.toy-piece');
    const scoreEl = document.getElementById('score-counter');
    const restartBtn = document.getElementById('restart-btn');
    let currentScore = 1420;

    pieces.forEach((piece) => {
      piece.addEventListener('click', () => {
        piece.classList.add('scale-105', 'rotate-1');
        setTimeout(() => {
          piece.classList.remove('scale-105', 'rotate-1');
        }, 150);

        currentScore += 30;
        if (scoreEl) {
          scoreEl.textContent = currentScore.toLocaleString();
        }
      });
    });

    if (restartBtn) {
      restartBtn.addEventListener('click', () => {
        restartBtn.classList.add('rotate-180');
        setTimeout(() => {
          restartBtn.classList.remove('rotate-180');
        }, 300);
      });
    }
  })();
</script></main></body></html>
